  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="24" fill="rgba(255,255,255,0.62)" stroke="#d7dee5"/>
  <text x="48" y="76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="800" fill="#1f2933">RepoMap 用图排名压缩全仓上下文</text>
  <text x="48" y="110" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#52616b">定义和引用变成文件图；聊天文件、提到的标识符和命名形态改变边权与个性化。</text>
