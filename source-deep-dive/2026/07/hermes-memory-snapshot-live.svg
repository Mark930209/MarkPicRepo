<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="MemoryStore 同时维护 frozen snapshot 和 live state">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#9aa7b2"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="24" fill="rgba(255,255,255,0.62)" stroke="#d7dee5"/>
  <text x="48" y="76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="800" fill="#1f2933">MemoryStore 同时维护 frozen snapshot 和 live state</text>
  <text x="48" y="110" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#52616b">系统 prompt 使用会话开始时的快照；工具写入立即落盘，但不破坏本回合 prompt cache。</text>
  <g font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <g>
      <rect x="70" y="145" width="1060" height="67" rx="14" fill="#ffffff" stroke="#d7dee5"/>
      <circle cx="104" cy="179" r="18" fill="#2f6fbb" opacity="0.18" stroke="#2f6fbb"/>
      <text x="104" y="186" text-anchor="middle" font-size="17" font-weight="800" fill="#2f6fbb">01</text>
      <text x="142" y="174" font-size="21" font-weight="750" fill="#1f2933">load_from_disk</text>
      <text x="430" y="174" font-size="18" fill="#52616b">读取 MEMORY.md / USER.md</text>
      <text x="430" y="199" font-size="16" fill="#6c7780">dedupe entries</text>
    </g>
<g>
      <rect x="70" y="224" width="1060" height="67" rx="14" fill="#ffffff" stroke="#d7dee5"/>
      <circle cx="104" cy="258" r="18" fill="#16857a" opacity="0.18" stroke="#16857a"/>
      <text x="104" y="265" text-anchor="middle" font-size="17" font-weight="800" fill="#16857a">02</text>
      <text x="142" y="253" font-size="21" font-weight="750" fill="#1f2933">sanitize</text>
      <text x="430" y="253" font-size="18" fill="#52616b">strict threat scan</text>
      <text x="430" y="278" font-size="16" fill="#6c7780">poison entry -&gt; BLOCKED placeholder</text>
    </g>
<g>
      <rect x="70" y="303" width="1060" height="67" rx="14" fill="#ffffff" stroke="#d7dee5"/>
      <circle cx="104" cy="337" r="18" fill="#b97819" opacity="0.18" stroke="#b97819"/>
      <text x="104" y="344" text-anchor="middle" font-size="17" font-weight="800" fill="#b97819">03</text>
      <text x="142" y="332" font-size="21" font-weight="750" fill="#1f2933">snapshot</text>
      <text x="430" y="332" font-size="18" fill="#52616b">_system_prompt_snapshot</text>
      <text x="430" y="357" font-size="16" fill="#6c7780">本会话系统 prompt 使用</text>
    </g>
<g>
      <rect x="70" y="382" width="1060" height="67" rx="14" fill="#ffffff" stroke="#d7dee5"/>
      <circle cx="104" cy="416" r="18" fill="#7556a5" opacity="0.18" stroke="#7556a5"/>
      <text x="104" y="423" text-anchor="middle" font-size="17" font-weight="800" fill="#7556a5">04</text>
      <text x="142" y="411" font-size="21" font-weight="750" fill="#1f2933">tool write</text>
      <text x="430" y="411" font-size="18" fill="#52616b">memory(action=add/replace/remove)</text>
      <text x="430" y="436" font-size="16" fill="#6c7780">live entries 立即变化</text>
    </g>
<g>
      <rect x="70" y="461" width="1060" height="67" rx="14" fill="#ffffff" stroke="#d7dee5"/>
      <circle cx="104" cy="495" r="18" fill="#3f8b4f" opacity="0.18" stroke="#3f8b4f"/>
      <text x="104" y="502" text-anchor="middle" font-size="17" font-weight="800" fill="#3f8b4f">05</text>
      <text x="142" y="490" font-size="21" font-weight="750" fill="#1f2933">flush</text>
      <text x="430" y="490" font-size="18" fill="#52616b">atomic_replace + file lock</text>
      <text x="430" y="515" font-size="16" fill="#6c7780">下个会话重新快照</text>
    </g>
  </g>
  <rect x="48" y="626" width="1104" height="44" rx="12" fill="#fff8e7" stroke="#e0c88d"/>
  <text x="68" y="654" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#6b4a10">可迁移判断：进入系统 prompt 的记忆必须稳定，落盘记忆可以实时；这两个状态不能混为一谈。</text>
</svg>