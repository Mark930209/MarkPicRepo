<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Pi 的最小内核和扩展边界">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64727f"/>
    </marker>
    <style>
      .sans { font-family: 'Noto Sans SC','Microsoft YaHei',Arial,sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #1f2933; }
      .subtitle { font-size: 18px; fill: #52616b; }
      .zone-title { font-size: 19px; font-weight: 800; fill: #1f2933; }
      .card-title { font-size: 18px; font-weight: 800; fill: #1f2933; }
      .body { font-size: 16px; fill: #52616b; }
      .small { font-size: 15px; fill: #52616b; }
      .label { font-size: 15px; font-weight: 700; fill: #43515c; }
      .zone { fill: #ffffff; stroke: #d7dee5; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #64727f; stroke-width: 2.4; marker-end: url(#arrow); }
      .soft-arrow { fill: none; stroke: #9aa7b2; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="24" fill="#ffffff" opacity="0.72" stroke="#d7dee5"/>

  <g class="sans">
    <text x="56" y="74" class="title">Pi 的最小内核和扩展边界</text>
    <text x="56" y="108" class="subtitle">入口可以很多，能力来源也可以扩展，但工具可见性和 prompt 重建都收敛到 AgentSession。</text>

    <g id="entry-zone">
      <rect x="64" y="156" width="250" height="330" rx="18" class="zone"/>
      <text x="88" y="192" class="zone-title">入口层只做翻译</text>
      <text x="88" y="218" class="small">不直接拥有工具运行时</text>

      <rect x="88" y="244" width="202" height="72" rx="14" class="card" stroke="#2f6fbb"/>
      <text x="108" y="276" class="card-title">CLI / main.ts</text>
      <text x="108" y="302" class="body">parseArgs → options</text>

      <path d="M189 320 L189 348" class="soft-arrow"/>
      <text x="202" y="342" class="small">交给 SDK</text>

      <rect x="88" y="360" width="202" height="76" rx="14" class="card" stroke="#16857a"/>
      <text x="108" y="392" class="card-title">SDK / sdk.ts</text>
      <text x="108" y="418" class="body">initialActiveToolNames</text>
    </g>

    <g id="session-zone">
      <rect x="374" y="136" width="430" height="410" rx="20" fill="#fffaf0" stroke="#b97819" stroke-width="3"/>
      <text x="402" y="176" class="zone-title">AgentSession 运行时所有权边界</text>
      <text x="402" y="204" class="small">统一决定工具来源、可见性、执行包装和 prompt 文本</text>

      <rect x="408" y="232" width="362" height="68" rx="14" class="card" stroke="#b97819"/>
      <text x="430" y="261" class="card-title">Definition Registry</text>
      <text x="430" y="286" class="body">builtin / extension / SDK tool definitions</text>

      <path d="M589 305 L589 328" class="soft-arrow"/>
      <text x="604" y="323" class="small">wrap + sourceInfo</text>

      <rect x="408" y="336" width="362" height="68" rx="14" class="card" stroke="#7556a5"/>
      <text x="430" y="365" class="card-title">Tool Registry</text>
      <text x="430" y="390" class="body">可执行 AgentTool，带统一 runner context</text>

      <path d="M589 409 L589 432" class="soft-arrow"/>
      <text x="604" y="427" class="small">select active</text>

      <rect x="408" y="440" width="362" height="74" rx="14" class="card" stroke="#bd4b4b"/>
      <text x="430" y="470" class="card-title">Active Tools + Prompt Builder</text>
      <text x="430" y="496" class="body">只把 active tools 写进系统提示词</text>
    </g>

    <g id="source-zone">
      <rect x="862" y="156" width="274" height="330" rx="18" class="zone"/>
      <text x="886" y="192" class="zone-title">能力来源可以增长</text>
      <text x="886" y="218" class="small">但不能绕过 registry</text>

      <rect x="886" y="244" width="226" height="58" rx="13" class="card" stroke="#3f8b4f"/>
      <text x="906" y="270" class="card-title">内置工具 definitions</text>
      <text x="906" y="292" class="small">read / bash / edit / write</text>

      <rect x="886" y="324" width="226" height="58" rx="13" class="card" stroke="#7556a5"/>
      <text x="906" y="350" class="card-title">ExtensionRunner</text>
      <text x="906" y="372" class="small">registered tools + hooks</text>

      <rect x="886" y="404" width="226" height="58" rx="13" class="card" stroke="#16857a"/>
      <text x="906" y="430" class="card-title">SDK custom tools</text>
      <text x="906" y="452" class="small">sourceInfo: &lt;sdk:name&gt;</text>
    </g>

    <path d="M290 398 C330 398, 334 278, 408 266" class="arrow"/>
    <rect x="318" y="330" width="76" height="28" rx="14" fill="#f7fafc" stroke="#d7dee5"/>
    <text x="356" y="350" text-anchor="middle" class="label">options</text>

    <path d="M862 318 C830 318, 808 266, 770 266" class="arrow"/>
    <rect x="780" y="290" width="84" height="28" rx="14" fill="#f7fafc" stroke="#d7dee5"/>
    <text x="822" y="310" text-anchor="middle" class="label">definitions</text>

    <rect x="374" y="568" width="430" height="74" rx="18" fill="#fff7f2" stroke="#bd4b4b" stroke-width="2.5"/>
    <text x="402" y="598" class="card-title">System Prompt</text>
    <text x="402" y="624" class="body">模型只看当前 active tools；工具变化后同步 rebuild。</text>
    <path d="M589 514 L589 568" class="arrow"/>
    <text x="606" y="548" class="label">rebuild</text>

    <rect x="56" y="656" width="1088" height="34" rx="12" fill="#fff8e7" stroke="#e0c88d"/>
    <text x="76" y="679" class="label" fill="#6b4a10">启发：先定运行时所有权边界，再接入 CLI、SDK、扩展和工具生态；不要让每个入口各自拼工具数组。</text>
  </g>
</svg>