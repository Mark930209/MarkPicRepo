<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Pi 的最小内核和扩展边界">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#9aa7b2"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="24" fill="rgba(255,255,255,0.62)" stroke="#d7dee5"/>
  <text x="48" y="76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="800" fill="#1f2933">Pi 的最小内核和扩展边界</text>
  <text x="48" y="110" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#52616b">CLI 只把参数翻译给 SDK；AgentSession 拥有工具注册表、扩展运行器和 prompt 重建权。</text>
  <g font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <g id="cli">
    <rect x="40" y="145" width="205" height="110" rx="16" fill="#ffffff" stroke="#2f6fbb" stroke-width="3"/>
    <rect x="40" y="145" width="205" height="42" rx="16" fill="#2f6fbb" opacity="0.12"/>
    <text x="60" y="174" font-size="22" font-weight="700" fill="#1f2933">CLI / main.ts</text>
    <text x="60" y="217" font-size="17" fill="#52616b">parseArgs</text>
<text x="60" y="243" font-size="17" fill="#52616b">createAgentSession options</text>
  </g>
<g id="sdk">
    <rect x="310" y="145" width="210" height="110" rx="16" fill="#ffffff" stroke="#16857a" stroke-width="3"/>
    <rect x="310" y="145" width="210" height="42" rx="16" fill="#16857a" opacity="0.12"/>
    <text x="330" y="174" font-size="22" font-weight="700" fill="#1f2933">SDK / sdk.ts</text>
    <text x="330" y="217" font-size="17" fill="#52616b">model + settings</text>
<text x="330" y="243" font-size="17" fill="#52616b">initialActiveToolNames</text>
  </g>
<g id="session">
    <rect x="585" y="105" width="260" height="190" rx="16" fill="#ffffff" stroke="#b97819" stroke-width="3"/>
    <rect x="585" y="105" width="260" height="42" rx="16" fill="#b97819" opacity="0.12"/>
    <text x="605" y="134" font-size="22" font-weight="700" fill="#1f2933">AgentSession</text>
    <text x="605" y="177" font-size="17" fill="#52616b">_buildRuntime()</text>
<text x="605" y="203" font-size="17" fill="#52616b">_refreshToolRegistry()</text>
<text x="605" y="229" font-size="17" fill="#52616b">setActiveToolsByName()</text>
  </g>
<g id="builtin">
    <rect x="910" y="80" width="230" height="105" rx="16" fill="#ffffff" stroke="#3f8b4f" stroke-width="3"/>
    <rect x="910" y="80" width="230" height="42" rx="16" fill="#3f8b4f" opacity="0.12"/>
    <text x="930" y="109" font-size="22" font-weight="700" fill="#1f2933">内置工具</text>
    <text x="930" y="152" font-size="17" fill="#52616b">read</text>
<text x="930" y="178" font-size="17" fill="#52616b">bash</text>
<text x="930" y="204" font-size="17" fill="#52616b">edit</text>
<text x="930" y="230" font-size="17" fill="#52616b">write</text>
  </g>
<g id="ext">
    <rect x="910" y="220" width="230" height="120" rx="16" fill="#ffffff" stroke="#7556a5" stroke-width="3"/>
    <rect x="910" y="220" width="230" height="42" rx="16" fill="#7556a5" opacity="0.12"/>
    <text x="930" y="249" font-size="22" font-weight="700" fill="#1f2933">扩展 / SDK 工具</text>
    <text x="930" y="292" font-size="17" fill="#52616b">ExtensionRunner</text>
<text x="930" y="318" font-size="17" fill="#52616b">wrapRegisteredTools</text>
  </g>
<g id="prompt">
    <rect x="585" y="405" width="260" height="125" rx="16" fill="#ffffff" stroke="#bd4b4b" stroke-width="3"/>
    <rect x="585" y="405" width="260" height="42" rx="16" fill="#bd4b4b" opacity="0.12"/>
    <text x="605" y="434" font-size="22" font-weight="700" fill="#1f2933">System Prompt</text>
    <text x="605" y="477" font-size="17" fill="#52616b">只列 active tools</text>
<text x="605" y="503" font-size="17" fill="#52616b">context + skills</text>
  </g>
<path d="M 245 200 C 277.5 200, 277.5 200, 310 200" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="277.5" y="192" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">options</text>
<path d="M 520 200 C 552.5 200, 552.5 200, 585 200" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="552.5" y="192" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">创建会话</text>
<path d="M 845 200 C 877.5 200, 877.5 132.5, 910 132.5" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="877.5" y="158.25" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">base defs</text>
<path d="M 845 200 C 877.5 200, 877.5 280, 910 280" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="877.5" y="232" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">registered tools</text>
<path d="M 845 295 C 715 295, 715 405, 585 405" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="715" y="342" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">rebuild</text>
  </g>
  <rect x="48" y="626" width="1104" height="44" rx="12" fill="#fff8e7" stroke="#e0c88d"/>
  <text x="68" y="654" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#6b4a10">可迁移判断：工具越少，边界越清楚；扩展只能通过注册表进入运行时。</text>
</svg>