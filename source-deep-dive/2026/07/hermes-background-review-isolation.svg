<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Background review 的隔离边界">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#9aa7b2"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="24" fill="rgba(255,255,255,0.62)" stroke="#d7dee5"/>
  <text x="48" y="76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="800" fill="#1f2933">Background review 的隔离边界</text>
  <text x="48" y="110" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#52616b">复盘 fork 可以写 memory/skill，但不能写真实 session，也不能调用非白名单工具。</text>
  <g font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <g>
      <rect x="70" y="150" width="500" height="380" rx="18" fill="#ffffff" stroke="#16857a" stroke-width="3"/>
      <rect x="70" y="150" width="500" height="68" rx="18" fill="#16857a" opacity="0.14"/>
      <text x="98" y="193" font-size="27" font-weight="800" fill="#1f2933">Hermes review fork</text>
      <g><circle cx="106" cy="262" r="7" fill="#16857a"/><text x="128" y="269" font-size="21" fill="#1f2933">继承主模型运行时和缓存</text></g>
<g><circle cx="106" cy="320" r="7" fill="#16857a"/><text x="128" y="327" font-size="21" fill="#1f2933">skip_memory 避免外部记忆污染</text></g>
<g><circle cx="106" cy="378" r="7" fill="#16857a"/><text x="128" y="385" font-size="21" fill="#1f2933">_persist_disabled 禁止写 session db</text></g>
<g><circle cx="106" cy="436" r="7" fill="#16857a"/><text x="128" y="443" font-size="21" fill="#1f2933">只允许 memory / skill 工具</text></g>
    </g>
<g>
      <rect x="630" y="150" width="500" height="380" rx="18" fill="#ffffff" stroke="#bd4b4b" stroke-width="3"/>
      <rect x="630" y="150" width="500" height="68" rx="18" fill="#bd4b4b" opacity="0.14"/>
      <text x="658" y="193" font-size="27" font-weight="800" fill="#1f2933">危险做法</text>
      <g><circle cx="666" cy="262" r="7" fill="#bd4b4b"/><text x="688" y="269" font-size="21" fill="#1f2933">复盘提示写回真实会话</text></g>
<g><circle cx="666" cy="320" r="7" fill="#bd4b4b"/><text x="688" y="327" font-size="21" fill="#1f2933">复盘工具集等同前台工具集</text></g>
<g><circle cx="666" cy="378" r="7" fill="#bd4b4b"/><text x="688" y="385" font-size="21" fill="#1f2933">未读目标 skill 就改写</text></g>
<g><circle cx="666" cy="436" r="7" fill="#bd4b4b"/><text x="688" y="443" font-size="21" fill="#1f2933">把用户偏好和操作技巧混存</text></g>
    </g>
  </g>
  <rect x="48" y="626" width="1104" height="44" rx="12" fill="#fff8e7" stroke="#e0c88d"/>
  <text x="68" y="654" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#6b4a10">可迁移判断：自动学习越强，越需要把自我修改通道收窄并留下可拒绝的 guard。</text>
</svg>