<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="OpenCode 把编码 Agent 放进服务端会话">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#9aa7b2"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="24" fill="rgba(255,255,255,0.62)" stroke="#d7dee5"/>
  <text x="48" y="76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="800" fill="#1f2933">OpenCode 把编码 Agent 放进服务端会话</text>
  <text x="48" y="110" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#52616b">TUI、桌面和远程客户端只是入口；真正的运行状态在 server/session/permission/tool 之间流动。</text>
  <g font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <g id="client">
    <rect x="40" y="135" width="220" height="135" rx="16" fill="#ffffff" stroke="#2f6fbb" stroke-width="3"/>
    <rect x="40" y="135" width="220" height="42" rx="16" fill="#2f6fbb" opacity="0.12"/>
    <text x="60" y="164" font-size="22" font-weight="700" fill="#1f2933">客户端</text>
    <text x="60" y="207" font-size="17" fill="#52616b">TUI / Desktop / API</text>
<text x="60" y="233" font-size="17" fill="#52616b">POST /session/:id/message</text>
  </g>
<g id="routes">
    <rect x="325" y="135" width="215" height="135" rx="16" fill="#ffffff" stroke="#16857a" stroke-width="3"/>
    <rect x="325" y="135" width="215" height="42" rx="16" fill="#16857a" opacity="0.12"/>
    <text x="345" y="164" font-size="22" font-weight="700" fill="#1f2933">SessionRoutes</text>
    <text x="345" y="207" font-size="17" fill="#52616b">Hono route</text>
<text x="345" y="233" font-size="17" fill="#52616b">stream JSON response</text>
  </g>
<g id="prompt">
    <rect x="600" y="95" width="260" height="175" rx="16" fill="#ffffff" stroke="#b97819" stroke-width="3"/>
    <rect x="600" y="95" width="260" height="42" rx="16" fill="#b97819" opacity="0.12"/>
    <text x="620" y="124" font-size="22" font-weight="700" fill="#1f2933">SessionPrompt</text>
    <text x="620" y="167" font-size="17" fill="#52616b">prompt()</text>
<text x="620" y="193" font-size="17" fill="#52616b">runLoop()</text>
<text x="620" y="219" font-size="17" fill="#52616b">resolveTools()</text>
  </g>
<g id="state">
    <rect x="930" y="70" width="220" height="115" rx="16" fill="#ffffff" stroke="#7556a5" stroke-width="3"/>
    <rect x="930" y="70" width="220" height="42" rx="16" fill="#7556a5" opacity="0.12"/>
    <text x="950" y="99" font-size="22" font-weight="700" fill="#1f2933">SessionRunState</text>
    <text x="950" y="142" font-size="17" fill="#52616b">one runner / session</text>
<text x="950" y="168" font-size="17" fill="#52616b">busy / idle / cancel</text>
  </g>
<g id="processor">
    <rect x="930" y="230" width="220" height="135" rx="16" fill="#ffffff" stroke="#3f8b4f" stroke-width="3"/>
    <rect x="930" y="230" width="220" height="42" rx="16" fill="#3f8b4f" opacity="0.12"/>
    <text x="950" y="259" font-size="22" font-weight="700" fill="#1f2933">SessionProcessor</text>
    <text x="950" y="302" font-size="17" fill="#52616b">stream events</text>
<text x="950" y="328" font-size="17" fill="#52616b">message parts</text>
<text x="950" y="354" font-size="17" fill="#52616b">tool states</text>
  </g>
<g id="permission">
    <rect x="600" y="410" width="260" height="120" rx="16" fill="#ffffff" stroke="#bd4b4b" stroke-width="3"/>
    <rect x="600" y="410" width="260" height="42" rx="16" fill="#bd4b4b" opacity="0.12"/>
    <text x="620" y="439" font-size="22" font-weight="700" fill="#1f2933">Permission</text>
    <text x="620" y="482" font-size="17" fill="#52616b">allow / deny / ask</text>
<text x="620" y="508" font-size="17" fill="#52616b">pending Deferred</text>
  </g>
<path d="M 260 202.5 C 292.5 202.5, 292.5 202.5, 325 202.5" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="292.5" y="194.5" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">HTTP</text>
<path d="M 540 202.5 C 570 202.5, 570 182.5, 600 182.5" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="570" y="184.5" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">svc.prompt</text>
<path d="M 860 182.5 C 895 182.5, 895 127.5, 930 127.5" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="895" y="147" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">ensureRunning</text>
<path d="M 860 182.5 C 895 182.5, 895 297.5, 930 297.5" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="895" y="232" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">process stream</text>
<path d="M 930 297.5 C 895 297.5, 895 470, 860 470" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="895" y="375.75" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">ask on risk</text>
<path d="M 860 470 C 895 470, 895 297.5, 930 297.5" fill="none" stroke="#9aa7b2" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="895" y="375.75" text-anchor="middle" font-size="15" fill="#52616b" paint-order="stroke" stroke="#fbfaf7" stroke-width="5">reply / reject</text>
  </g>
  <rect x="48" y="626" width="1104" height="44" rx="12" fill="#fff8e7" stroke="#e0c88d"/>
  <text x="68" y="654" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#6b4a10">可迁移判断：生产级编码 Agent 先是一个可恢复的会话服务，其次才是一个漂亮终端界面。</text>
</svg>