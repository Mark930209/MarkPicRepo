<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="SEARCH/REPLACE 让模型补丁可回放">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#9aa7b2"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfaf7"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="24" fill="rgba(255,255,255,0.62)" stroke="#d7dee5"/>
  <text x="48" y="76" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="34" font-weight="800" fill="#1f2933">SEARCH/REPLACE 让模型补丁可回放</text>
  <text x="48" y="110" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" fill="#52616b">模型必须给出文件名、原文和替换文本；匹配失败变成 reflected_message，而不是悄悄改错。</text>
  <g font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif">
  <g>
      <rect x="70" y="150" width="500" height="380" rx="18" fill="#ffffff" stroke="#3f8b4f" stroke-width="3"/>
      <rect x="70" y="150" width="500" height="68" rx="18" fill="#3f8b4f" opacity="0.14"/>
      <text x="98" y="193" font-size="27" font-weight="800" fill="#1f2933">Aider edit block</text>
      <g><circle cx="106" cy="262" r="7" fill="#3f8b4f"/><text x="128" y="269" font-size="21" fill="#1f2933">find_original_update_blocks 解析块</text></g>
<g><circle cx="106" cy="320" r="7" fill="#3f8b4f"/><text x="128" y="327" font-size="21" fill="#1f2933">do_replace 先匹配原文</text></g>
<g><circle cx="106" cy="378" r="7" fill="#3f8b4f"/><text x="128" y="385" font-size="21" fill="#1f2933">apply_edits_dry_run 预检查</text></g>
<g><circle cx="106" cy="436" r="7" fill="#3f8b4f"/><text x="128" y="443" font-size="21" fill="#1f2933">失败反馈给下一轮模型</text></g>
    </g>
<g>
      <rect x="630" y="150" width="500" height="380" rx="18" fill="#ffffff" stroke="#bd4b4b" stroke-width="3"/>
      <rect x="630" y="150" width="500" height="68" rx="18" fill="#bd4b4b" opacity="0.14"/>
      <text x="658" y="193" font-size="27" font-weight="800" fill="#1f2933">常见坏复制</text>
      <g><circle cx="666" cy="262" r="7" fill="#bd4b4b"/><text x="688" y="269" font-size="21" fill="#1f2933">整文件覆盖缺少差异锚点</text></g>
<g><circle cx="666" cy="320" r="7" fill="#bd4b4b"/><text x="688" y="327" font-size="21" fill="#1f2933">匹配失败仍尝试模糊写入</text></g>
<g><circle cx="666" cy="378" r="7" fill="#bd4b4b"/><text x="688" y="385" font-size="21" fill="#1f2933">错误只打印给用户不回流模型</text></g>
<g><circle cx="666" cy="436" r="7" fill="#bd4b4b"/><text x="688" y="443" font-size="21" fill="#1f2933">改完不提交也不跑检查</text></g>
    </g>
  </g>
  <rect x="48" y="626" width="1104" height="44" rx="12" fill="#fff8e7" stroke="#e0c88d"/>
  <text x="68" y="654" font-family="'Noto Sans SC','Microsoft YaHei',Arial,sans-serif" font-size="18" font-weight="700" fill="#6b4a10">可迁移判断：让模型直接写最终文件很诱人，但可审计补丁格式更适合真实仓库。</text>
</svg>